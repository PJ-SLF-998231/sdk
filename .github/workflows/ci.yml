name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:dist
      - run: node scripts/check-css.mjs
      - run: node scripts/check-entries.mjs
      - run: node scripts/check-imports.mjs
      - run: node scripts/size-budget.mjs
      - run: node scripts/size-report.mjs
      - run: npm run check:example
      - run: npm run check:docs
      - run: node scripts/check-treeshake.mjs
      - run: npx attw --pack .
      - run: npx publint
      - run: npx tsc -p test/types/bundler
      - run: npx tsc -p test/types/node16
      - run: npm pack --dry-run
